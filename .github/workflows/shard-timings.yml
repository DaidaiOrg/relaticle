name: Shard Timings

# The Tests workflow splits the suite by each class's recorded duration. Recording it here,
# on the runners that run the shards, keeps the split balanced as tests are added.

on:
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    paths:
      - .github/workflows/shard-timings.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    name: Record Shard Timings
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_DB: relaticle_testing
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: json, dom, curl, libxml, mbstring, zip, intl
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --ansi --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.ci .env
          php artisan key:generate
          php artisan passport:keys --force --no-interaction

      - name: Record timings
        run: vendor/bin/pest --compact --parallel --update-shards --no-tia --configuration phpunit.ci.xml

      - name: Save timings for the Tests workflow
        uses: actions/cache/save@v6
        with:
          path: tests/.pest/shards.json
          key: pest-shards-${{ github.run_id }}

      - name: Upload timings
        uses: actions/upload-artifact@v7
        with:
          name: pest-shards
          path: tests/.pest/shards.json
          if-no-files-found: error
          retention-days: 7
